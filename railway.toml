[build]
builder = "nixpacks"
buildCommand = "rm -rf node_modules .vite dist apps/web/node_modules apps/web/.vite apps/web/dist apps/api/node_modules apps/api/dist .pnpm-store 2>/dev/null || true && pnpm store prune && pnpm install --force --no-frozen-lockfile --prod=false && cd apps/web && rm -rf dist .vite && pnpm build && cd ../api && rm -rf dist && pnpm build && cd ../.."

[deploy]
startCommand = "cd apps/api && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Full Stack Configuration - Railway
# Frontend + API serving from same domain
# Frontend: turismocinematografico.com.br
# API: turismocinematografico.com.br/api/*