[build]
builder = "nixpacks"
buildCommand = "rm -rf node_modules .vite dist apps/web/node_modules apps/web/.vite apps/web/dist apps/api/node_modules apps/api/dist .pnpm-store 2>/dev/null || true && pnpm store prune && pnpm install --force --no-frozen-lockfile --prod=false && pnpm --filter @conferencia/web build"

[deploy]
startCommand = "cd apps/web && npx serve dist -s -l $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Frontend-only configuration - Railway
# This service only builds and serves the frontend
# No API build, no Chromium installation

