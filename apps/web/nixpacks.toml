[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = [
  "rm -rf node_modules .vite dist .pnpm-store 2>/dev/null || true",
  "pnpm store prune || true",
  "pnpm install --force --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "rm -rf dist .vite 2>/dev/null || true",
  "pnpm build"
]

[start]
cmd = "npx serve dist -s -l $PORT"

