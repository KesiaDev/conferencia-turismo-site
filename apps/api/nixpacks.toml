[phases.setup]
nixPkgs = ["chromium"]

[phases.install]
cmds = [
  "rm -rf node_modules .vite dist apps/web/node_modules apps/web/.vite apps/web/dist apps/api/node_modules apps/api/dist .pnpm-store 2>/dev/null || true",
  "pnpm store prune",
  "pnpm install --force --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "cd apps/web && rm -rf dist .vite && pnpm build",
  "cd ../api && rm -rf dist && PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm build"
]

[start]
cmd = "cd apps/api && node dist/index.js"

[env]
PUPPETEER_EXECUTABLE_PATH = "/nix/store/*-chromium-*/bin/chromium"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
DISPLAY = ":99"
