[phases.setup]
nixPkgs = ["chromium"]

[phases.install]
cmds = [
  "pnpm install --filter @conferencia/api --force || pnpm install --force"
]

[phases.build]
cmds = [
  "cd apps/api && PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm build"
]

[start]
cmd = "cd apps/api && node dist/index.js"

[env]
PUPPETEER_EXECUTABLE_PATH = "/nix/store/*-chromium-*/bin/chromium"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
DISPLAY = ":99"
