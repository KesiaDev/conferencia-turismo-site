[build]
builder = "nixpacks"
buildCommand = "pnpm install --filter @conferencia/api --force && cd apps/api && PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm build"

[deploy]
startCommand = "cd apps/api && node dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# API-only configuration - Railway
# This service only builds the API
# Chromium is provided by nixpacks (nixpacks.toml)
